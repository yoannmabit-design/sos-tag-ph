<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SOS Tag — my profile</title>
<style>
:root{--ink:#101820;--red:#c8102e;--line:#d9dde1}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink)}
main{max-width:560px;margin:0 auto;padding:24px 18px 60px}
h1{font-size:2rem;margin:0 0 .6em}h2{font-size:1.2rem;margin:1.6em 0 .4em}
label{display:block;font-weight:600;margin-top:14px}
input,textarea{width:100%;font:inherit;padding:10px;border:1.5px solid var(--ink);border-radius:6px;margin-top:4px}
button{font:inherit;font-weight:700;padding:12px 18px;margin:16px 8px 0 0;border-radius:6px;border:2px solid var(--red);background:var(--red);color:#fff;cursor:pointer}
button.ghost{background:#fff;color:var(--red)}
.hint{color:#4a5560}#msg{font-weight:600;min-height:1.4em}
li{padding:8px 0;border-top:1px solid var(--line);list-style:none}ul{padding:0}
</style>
</head>
<body>
<main>
<h1>SOS Tag</h1>
<p id="msg"></p>
<section id="auth">
  <label>Email <input id="email" type="email" autocomplete="email"></label>
  <label>Password (8+ characters) <input id="pass" type="password" autocomplete="current-password"></label>
  <button id="in">Sign in</button><button id="up" class="ghost">Create account</button>
</section>
<section id="main" hidden>
  <p class="hint">Anyone who scans your tag sees what you fill in below. Leave a field empty to hide it.</p>
  <form id="f">
    <label>Full name <input id="name"></label>
    <label>Blood type <input id="blood"></label>
    <label>Allergies <textarea id="allergies" rows="2"></textarea></label>
    <label>Medical conditions <textarea id="conditions" rows="2"></textarea></label>
    <label>Medications <textarea id="meds" rows="2"></textarea></label>
    <label>Notes for responders <textarea id="notes" rows="2"></textarea></label>
    <label>Contact 1 name <input id="c1n"></label>
    <label>Contact 1 phone <input id="c1p" type="tel"></label>
    <label>Contact 2 name <input id="c2n"></label>
    <label>Contact 2 phone <input id="c2p" type="tel"></label>
    <label>Your own phone (receives location alerts too) <input id="ownerPhone" type="tel"></label>
    <label>Health insurance
      <select id="insurer">
        <option value="">None</option>
        <option>PhilHealth</option>
        <option>Maxicare</option>
        <option>Intellicare</option>
        <option>Medicard</option>
        <option value="Other">Other</option>
      </select>
    </label>
    <label id="insurerOtherWrap" hidden>Insurer name <input id="insurerOther"></label>
    <label>Member or PIN number <input id="insurerNo"></label>
    <label><input type="checkbox" id="showInsurer" style="width:auto;margin-right:8px">Show my insurance number to responders</label>
    <label>Tag code to activate (optional) <input id="code" maxlength="12"></label>
    <button type="submit">Save</button><button type="button" id="out" class="ghost">Sign out</button>
    <button type="button" id="del" class="ghost">Delete my account and data</button>
  </form>
  <h2>My tags</h2>
  <ul id="tags"></ul>
</section>
</main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-functions.js";

// Configuration Firebase du projet sos-tag-ph (section « Vos applications » de la console).
const app = initializeApp({
  apiKey: "AIzaSyDM0QaPpVg6M3NWPhIU_xi95l1cmKw9Ovg",
  authDomain: "sos-tag-ph.firebaseapp.com",
  projectId: "sos-tag-ph",
  storageBucket: "sos-tag-ph.firebasestorage.app",
  messagingSenderId: "141929757363",
  appId: "1:141929757363:web:cfc64e41dc0a71c8ec4ec6"
});

const auth = getAuth(app), db = getFirestore(app), fn = getFunctions(app, "asia-southeast1");
const $ = (id) => document.getElementById(id);
const msg = (t) => ($("msg").textContent = t);
const fields = ["name", "blood", "allergies", "conditions", "meds", "notes"];

$("code").value = (new URLSearchParams(location.search).get("code") || "").toUpperCase();
$("in").onclick = () => signInWithEmailAndPassword(auth, $("email").value, $("pass").value).catch((e) => msg(e.message));
$("up").onclick = () => createUserWithEmailAndPassword(auth, $("email").value, $("pass").value).catch((e) => msg(e.message));
$("out").onclick = () => signOut(auth);
function toggleOther() { $("insurerOtherWrap").hidden = $("insurer").value !== "Other"; }
$("insurer").onchange = toggleOther;
$("del").onclick = async () => {
  if (!confirm("Delete your profile, scan and location history and account? Your stickers will be unlinked and cannot be recovered. This cannot be undone.")) return;
  try {
    await httpsCallable(fn, "deleteAccount")({});
    await signOut(auth);
    msg("Your account and data were deleted.");
  } catch (err) { msg(err.message); }
};

onAuthStateChanged(auth, async (u) => {
  $("auth").hidden = !!u; $("main").hidden = !u;
  if (!u) return;
  const s = await getDoc(doc(db, "profiles", u.uid));
  const data = s.exists() ? s.data() : {};
  const p = data.public || {};
  fields.forEach((k) => ($(k).value = p[k] || ""));
  const c = p.contacts || [];
  ["c1", "c2"].forEach((k, i) => { $(k + "n").value = c[i]?.name || ""; $(k + "p").value = c[i]?.phone || ""; });
  $("ownerPhone").value = data.ownerPhone || "";
  const known = ["PhilHealth", "Maxicare", "Intellicare", "Medicard"];
  const ins = p.insurer || "";
  $("insurer").value = known.includes(ins) ? ins : (ins ? "Other" : "");
  $("insurerOther").value = known.includes(ins) ? "" : ins;
  $("insurerNo").value = p.insurerNo || "";
  $("showInsurer").checked = !!p.showInsurer;
  toggleOther();
  listTags(u);
});

$("f").onsubmit = async (e) => {
  e.preventDefault();
  const u = auth.currentUser, pub = {};
  fields.forEach((k) => (pub[k] = $(k).value.trim()));
  pub.contacts = ["c1", "c2"].map((k) => ({ name: $(k + "n").value.trim(), phone: $(k + "p").value.trim() })).filter((c) => c.phone);
  const sel = $("insurer").value;
  pub.insurer = sel === "Other" ? $("insurerOther").value.trim() : sel;
  pub.insurerNo = $("insurerNo").value.trim();
  pub.showInsurer = $("showInsurer").checked;
  try {
    await setDoc(doc(db, "profiles", u.uid), { ownerUid: u.uid, ownerPhone: $("ownerPhone").value.trim(), public: pub });
    const code = $("code").value.trim().toUpperCase();
    if (code) await httpsCallable(fn, "claimSticker")({ code });
    msg(code ? "Saved. Your tag is active." : "Saved.");
    $("code").value = ""; listTags(u);
  } catch (err) { msg(err.message); }
};

async function listTags(u) {
  const q = await getDocs(query(collection(db, "stickers"), where("ownerUid", "==", u.uid)));
  const ul = $("tags"); ul.replaceChildren();
  q.forEach((d) => {
    const s = d.data(), li = document.createElement("li"), b = document.createElement("button");
    li.textContent = `${d.id.slice(0, 4)}… (${s.status}) `;
    b.className = "ghost"; b.textContent = s.status === "active" ? "Mark as lost" : "Reactivate";
    b.onclick = async () => {
      await httpsCallable(fn, "setStickerStatus")({ code: d.id, status: s.status === "active" ? "blocked" : "active" });
      listTags(u);
    };
    li.append(b); ul.append(li);
  });
}
</script>
</body>
</html>
