<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="theme-color" content="#c8102e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SOS Tag">
<title>Emergency information</title>
<style>
:root{--ink:#101820;--red:#c8102e;--amber:#ffc72c;--line:#d9dde1}
*{box-sizing:border-box}
body{margin:0;font:18px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:#fff}
header{background:var(--red);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.sos{background:#fff;color:var(--red);font-weight:800;padding:12px 18px;border-radius:8px;text-decoration:none}
main{max-width:640px;margin:0 auto;padding:20px 18px 48px}
h1{font-size:2.4rem;line-height:1.1;margin:.2em 0 .5em}
.alert{background:var(--amber);padding:14px 16px;border-radius:8px;font-weight:700;margin:0 0 18px}
.note{color:#4a5560;font-size:.95rem;margin:18px 0 0}
.status{font-weight:700;margin:18px 0 0}
dl{margin:0}
dt{font-weight:700;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
dd{margin:4px 0 0;white-space:pre-wrap}
.call{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px;padding:16px;border:2px solid var(--ink);border-radius:8px;color:var(--ink);text-decoration:none;font-weight:700}
.call span{font-weight:400}
</style>
</head>
<body>
<header><img src="/icon.svg" alt="" width="28" height="28" style="vertical-align:middle;margin-right:10px"><strong>Emergency information</strong><a class="sos" href="tel:911">Call 911</a></header>
<main><p>Loading…</p></main>
<script>
const API = "https://asia-southeast1-sos-tag-ph.cloudfunctions.net/scan";
const REPORT = "https://asia-southeast1-sos-tag-ph.cloudfunctions.net/reportLocation";
const code = ((new URLSearchParams(location.search).get("code")) || (location.pathname.match(/[2-9A-HJKMNP-Z]{12}/i) || [""])[0]).toUpperCase();
const m = document.querySelector("main");
const el = (t, c, x) => { const n = document.createElement(t); if (c) n.className = c; if (x != null) n.textContent = x; return n; };
const say = (h, p) => m.replaceChildren(el("h1", 0, h), el("p", 0, p));

function shareLocation(box) {
  if (!navigator.geolocation) { box.textContent = "Location is not available on this phone. Call 911 and give the address or a landmark."; return; }
  box.textContent = "Waiting for location permission…";
  navigator.geolocation.getCurrentPosition(
    async (pos) => {
      const { latitude: lat, longitude: lng, accuracy } = pos.coords;
      const map = `https://maps.google.com/?q=${lat.toFixed(6)},${lng.toFixed(6)}`;
      try {
        const r = await fetch(REPORT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ code, lat, lng, accuracy: Math.round(accuracy) }),
        });
        const d = await r.json();
        if (d.status === "sent") {
          box.textContent = `Location sent to ${d.sent} contact(s). Accuracy about ${Math.round(accuracy)} m.`;
          box.append(el("br"), Object.assign(el("a", 0, "Open the location on a map"), { href: map, target: "_blank", rel: "noopener" }));
        } else if (d.status === "throttled") {
          box.textContent = "A location was already sent a moment ago.";
        } else {
          box.textContent = "The location could not be sent. Call 911 and give the address or a landmark.";
        }
      } catch {
        box.textContent = "The location could not be sent. Check the connection, and call 911.";
      }
    },
    () => { box.textContent = "Location not shared. Call 911 and give the address or a landmark."; },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
  );
}

fetch(`${API}?code=${encodeURIComponent(code)}`)
  .then((r) => r.json())
  .then((d) => {
    if (d.status === "invalid") return say("Unknown tag", "This code is not registered.");
    if (d.status === "blocked") return say("Tag deactivated", "The owner marked this tag as lost. Call 911 if someone needs help.");
    if (d.status === "unclaimed") {
      say("This tag is not activated yet", "If it is yours, activate it to add your emergency details.");
      const a = el("a", "call", "Activate this tag"); a.href = `/app.html?code=${encodeURIComponent(code)}`;
      return m.append(a);
    }
    const p = d.profile;
    m.replaceChildren(el("h1", 0, p.name || "Name not provided"));
    if (p.allergies) m.append(el("p", "alert", "Allergies: " + p.allergies));
    const dl = el("dl");
    [["Blood type", p.blood], ["Medical conditions", p.conditions], ["Medications", p.meds], ["Notes", p.notes]]
      .forEach(([k, v]) => { if (v) dl.append(el("dt", 0, k), el("dd", 0, v)); });
    if (p.insurerNo) dl.append(el("dt", 0, "Health insurance"), el("dd", 0, (p.insurer ? p.insurer + ": " : "") + p.insurerNo));
    m.append(dl);
    (p.contacts || []).forEach((c) => {
      const a = el("a", "call"); a.href = "tel:" + String(c.phone).replace(/[^+\d]/g, "");
      a.append(el("b", 0, c.name || "Emergency contact"), el("span", 0, c.phone));
      m.append(a);
    });
    m.append(el("p", "note", "Your location will be sent to this person's emergency contacts by text message."));
    const status = el("p", "status", "Asking for your location…");
    m.append(status);
    shareLocation(status);
  })
  .catch(() => say("Could not load", "Check the connection and reload. In an emergency, call 911."));
</script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js");</script>
</body>
</html>
